[package]
name = "nuvek-neo4j"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/nuvek-neo4j"
readme = "README.md"
keywords = ["neo4j", "bolt", "cypher", "graph", "read-only"]
categories = ["api-bindings", "database"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]
description = "Read-only Neo4j Bolt client with a client-side write-clause guard and bounded queries. Connection settings are supplied by the caller."

[dependencies]
regex.workspace = true
anyhow.workspace = true
nuvek-core = { path = "../nuvek-core", version = "1", default-features = false }
neo4rs.workspace = true
serde_json.workspace = true
tokio.workspace = true

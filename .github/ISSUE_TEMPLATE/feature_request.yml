# yaml-language-server: $schema=https://www.schemastore.org/github-issue-forms.json
name: Feature request
description: Suggest a new feature or a change to how something works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Start from the problem: what you're trying to do, and what gets in the way.

        nuvek-core names no host, path or deployment. A value that would differ on someone else's machine belongs in your code or configuration, passed in as a parameter. A deployment-specific secret surface usually belongs in your `secret-surfaces.toml`.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the [open and closed issues](https://github.com/jean1880/nuvek-core/issues?q=is%3Aissue) and found no request for this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what makes it hard today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How you picture the API or behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered

  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      options:
        - "Yes, I'd like to open a pull request"
        - Maybe, with some guidance
        - "No"

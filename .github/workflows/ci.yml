name: CI

# The gate (fmt, clippy, tests, docs, MSRV, cargo-deny, gitleaks) on every run. On a push to
# master, and only when the repository variable PUBLISH is 'true', release-plz also runs:
# release-pr opens or updates the release pull request (version bumps and CHANGELOG entries), and
# release publishes to crates.io, tags each crate and creates its GitHub Release once every gate
# job in this same run has passed. release only publishes versions not yet on crates.io, so it
# acts once that pull request is merged.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Advisories change underneath us as RustSec publishes, so that check also runs daily.
    - cron: "41 5 * * *"
  workflow_dispatch:

# A newer push to a pull request cancels its older run. Every other run gets a group of its own,
# so a run on master is never cancelled or skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test (all features)
        run: cargo test --locked --workspace --all-features
      - name: Test (no default features)
        run: cargo test --locked --workspace --no-default-features
      # `--all-features` hides a module that compiles only when a sibling feature pulls its
      # dependency in, so each nuvek-core feature is also built on its own.
      - name: Each nuvek-core feature alone
        run: |
          for f in net ssh scrub log metrics git tracing mcp hook digest gateway; do
            echo "::group::$f"
            cargo check --locked -p nuvek-core --no-default-features --features "$f"
            echo "::endgroup::"
          done
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.90
        run: rustup toolchain install 1.90 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-
      - name: Check
        run: cargo +1.90 check --locked --workspace --all-features --all-targets

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # An advisory published today must not block a pull request that did not introduce it.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check ${{ matrix.checks }}

  secrets:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/gitleaks.tgz"
          curl -fsSLo "$tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan history
        run: gitleaks git --redact --no-banner .

  release-pr:
    name: release PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One release run at a time per branch, and a running one is never cancelled half-way.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: release
    # Every gate job above passed on this exact commit, in this run.
    needs: [check, msrv, deny, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
